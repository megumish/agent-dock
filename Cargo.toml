[package]
name = "agent-dock"
version = "0.1.0-alpha.4"
edition = "2024"
rust-version = "1.95"
description = "A locally controlled multi-agent dock"
license = "MIT"

# See DEPENDENCIES.md before adding or updating dependencies.
[dependencies]
libc = "0.2"
jiff = { version = "0.2", default-features = false, features = ["serde", "std"] }
rustyline = { version = "18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1"
uuid = { version = "1", default-features = false, features = ["serde", "std", "v5", "v7"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "sample_events"
test = true

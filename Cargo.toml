[package]
name = "agent-dock"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.95"
description = "A locally controlled multi-agent dock"
license = "MIT"

# See DEPENDENCIES.md before adding or updating dependencies.
[dependencies]
libc = "0.2"
rustyline = { version = "18", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1"

[dev-dependencies]
tempfile = "3"
